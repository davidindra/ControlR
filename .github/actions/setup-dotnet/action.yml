name: Setup .NET
description: Installs .NET 10.x and 9.x SDKs

runs:
  using: composite
  steps:
    - name: Setup .NET SDKs
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: |
          9.x
          10.x
      env:
        DOTNET_INSTALL_DIR: $HOME/.dotnet
        DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
        DOTNET_NOLOGO: true